name: Deploy to Production

on:
  push:
    branches: [master]

# One deploy at a time; never cancel mid-flip (avoids half-live state).
concurrency:
  group: wanbuffer-com-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: nice -n 10 npm ci --no-audit --no-fund

      - name: Build
        working-directory: ./web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Cap heap so the shared SSD2 box keeps headroom for other sites.
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: |
          set -euo pipefail
          ENV_FILE=/var/www/wan-buffer-website/shared/.env.local
          if [[ ! -f "$ENV_FILE" ]]; then
            ENV_FILE=/var/www/wan-buffer-website/web/.env.local
          fi
          cp "$ENV_FILE" .env.local
          # Low priority so build does not starve co-hosted apps.
          nice -n 15 ionice -c3 npx next build --webpack

      - name: Zero-downtime blue/green release
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:12}"
          # Touches ONLY wanbuffer.com (ports 3007/3107 + its nginx upstream).
          # Live traffic stays on the old color until the new instance returns HTTP 200.
          /var/www/wan-buffer-website/deploy-release.sh "$GITHUB_WORKSPACE/web" "$SHA"
